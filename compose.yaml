name: arconline-qq-gateway

services:
  gateway:
    image: arconline-qq-gateway:local
    container_name: arconline-qq-gateway
    build:
      context: .
      network: host
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /app/data/gateway.db
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8787}:8787"
    networks:
      - 1panel-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  1panel-network:
    external: true
    name: 1panel-network
